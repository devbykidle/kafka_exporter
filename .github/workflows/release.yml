---
name: Release
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '*' # Push events to matching v*, i.e. v1.0, v20.15.10

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: kafka_exporter

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        run: make push
        env:
          DOCKER_USERNAME: ${{ github.repository_owner }}
          GIT_TAG_NAME: ${{ github.ref_name }}

  release:
    name: Release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: Build cross-platform binaries and tarballs
        run: make crossbuild tarballs
      - name: Generate checksums
        run: |
          cd .tarballs
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
            | sort | xargs sha256sum > sha256sums.txt
          cat sha256sums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .tarballs/* --clobber
          else
            gh release create "$TAG" .tarballs/* --generate-notes --verify-tag
          fi
